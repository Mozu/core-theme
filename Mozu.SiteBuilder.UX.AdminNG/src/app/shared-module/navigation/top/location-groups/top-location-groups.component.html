<div class="col-md-11 sidebar">
    <div class="row">
        <div class="heading col-md-2 col-xs-2 col-sm-2">
            <h4>{{'SHARED.HEADER.pageTitle.locationGroups' | translate }}</h4>
        </div>
        
        <button type="button" class="btn btn-success pull-right"  (click)="showCreateLG()" *ngIf="!createMode">{{'SHARED.HEADER.actionButtons.locationGroups.create' | translate}}</button>
        <div class="pull-right">
            <button type="button" class="btn cancelbtn" (click)="saveCreateLG()" *ngIf="createMode">{{'SHARED.HEADER.actionButtons.locationGroups.cancel' | translate}}</button>
            <button type="button" class="btn btn-success" (click)="cancelCreateLG()" *ngIf="createMode">{{'SHARED.HEADER.actionButtons.locationGroups.save' | translate}}</button>
        </div>
    </div>
</div>
