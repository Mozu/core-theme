<div class="col-md-2 col-sm-2 sidebar">
<div class = "primeSidebar">
    <p-sidebar [(visible)]="visibleSidebar1" [baseZIndex]="10000" [showCloseIcon]="false" [blockScroll]="true">
        <p-tabView>
            <p-tabPanel header="Main">
                <p-menu [model]="items"></p-menu>
            </p-tabPanel>
            <p-tabPanel header="System">
                <p-menu [model]="systemItems"></p-menu>
            </p-tabPanel>
        </p-tabView>
    </p-sidebar>
    <span pButton type="button" (click)="visibleSidebar1 = true"><i class="fa fa-bars hamburgerMenu"></i></span>
</div>
</div>
