<div class="searchBar" [ngClass]="isEditMode? 'col-md-8 col-sm-8' : 'col-md-10 col-sm-10' " id="searchBar">
    <div class="input-group">
        <div class="input-group-btn">
            <button class="btn btn-default search-btn" type="button">
        <i [ngClass]="status ? 'pi-times' : 'pi-search'" class="pi"
          (click)="status ? resetSerach(searchBar): ''"></i>
      </button>
        </div>
        <input type="text" [(ngModel)]="quoteFilter.searchBarkeyword + quoteFilter.searchBarQuoteName + quoteFilter.searchBarQuoteId" class="form-control" #searchBar placeholder="{{'SHARED.NAVIGATION.Top.searchPlaceholder' | translate}}" (keyup)="toggleIcon($event)"
            (keyup.enter)="search(searchBar.value)" id="quote-search-input" name="quote-search-input">
    </div>
</div>

<div class="col-md-1 col-md-1">
    <span class="advance-filter" data-toggle="modal" data-target=".advanced-filter" type="button" data-backdrop="false"></span>
    <div class="modal-parent">
        <div class="modal advanced-filter" tabindex="-1" role="dialog">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                      aria-hidden="true">&times;</span></button>
                        <h4 class="modal-title" id="gridSystemModalLabel">Advanced Filter</h4>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="form-group">
                                <label for="keyword">Keyword Search</label>
                                <input type="text" class="form-control" id="keyword" name="keyword" [(ngModel)]='quoteFilter.keyword'>
                            </div>
                            <div class="form-group">
                                <label for="quoteName">Quote Name</label>
                                <input type="text" class="form-control" id="quoteName" name="quoteName" [(ngModel)]='quoteFilter.quoteName'>
                            </div>
                            <div class="form-group">
                                <label for="quoteId">Quote Id</label>
                                <input type="number" min="0" class="form-control" id="quoteId" name="quoteId" [(ngModel)]='quoteFilter.quoteId'>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <span type="button" class="btn cancelbtn" data-dismiss="modal">Cancel</span>
                        <button type="button" class="sbbtn btn btn-success">Filter</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
