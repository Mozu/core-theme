<h4>Selected Locations({{selectedLocations ? selectedLocations.length : 0}})</h4>
<p-table [columns]="cols" [value]="virtualLocations" [scrollable]="true" 
    [rows]="20" scrollHeight="200px" 
    [totalRecords]="totalRecords" 
    [virtualRowHeight]="28"
    [(selection)]="selectedLocations">

    <ng-template pTemplate="header" let-columns>
        <tr>
            <!-- <th style="width: 3em">
                <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
            </th> -->
            <th *ngFor="let col of columns">
                {{col.header}}
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData let-columns="columns">
        <tr style="height:34px" [pSelectableRow]="rowData">
            <!-- <td style="width: 3em">
                <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
            </td> -->
            <td *ngFor="let col of columns">
                {{rowData[col.field]}}
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="loadingbody" let-columns="columns">
        <tr style="height:34px">
            <td *ngFor="let col of columns">
                <div class="loading-text"></div>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage" let-columns>
        <tr>
            <td [attr.colspan]="columns.length">
                No records found
            </td>
        </tr>
    </ng-template>
    <!-- <ng-template pTemplate="summary">
            <ul>
                <li *ngFor="let location of selectedLocations" style="text-align: left">
                    {{location.code + ' - ' + location.name + ' - ' + location.address}}
                </li>
            </ul>
    </ng-template> -->
</p-table>
