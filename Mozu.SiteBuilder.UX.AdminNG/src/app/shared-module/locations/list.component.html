<h5>Locations</h5>
<!-- <h5>{{selectedLocations ? selectedLocations.length : 0}} Selected</h5> -->
<p-table [columns]="cols" [value]="virtualLocations" [scrollable]="true" 
    [rows]="20" scrollHeight="300px" 
    (onRowSelect)="rowSelected($event)" (onRowUnselect)="rowUnselected($event)"
    (onHeaderCheckboxToggle)="tableHeaderCheckboxToggle($event)"
    [(selection)]="selectedLocations" dataKey="code">
    
    <ng-template pTemplate="header" let-columns>
        <tr>
            <th style="width: 3em">
                <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
            </th>
            <th *ngFor="let col of columns">
                {{col.header}}
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData let-columns="columns">
        <tr style="height:34px" [pSelectableRow]="rowData">
            <td style="width: 3em">
                <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
            </td>
            <td class="row" *ngFor="let col of columns">
                <div class="col-md-7">{{rowData[col.field]}}</div>
                <div class="col-md-3 text-right">{{rowData.code}}</div>
                <div class="col-md-1"><i class="pi pi-info-circle" data-toggle="tooltip" data-placement="right" 
                    title="{{rowData.address ? rowData.address.address1 + ', ' + rowData.address.cityOrTown + ', ' + rowData.address.stateOrProvince : ''}}"></i></div>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="loadingbody" let-columns="columns">
        <tr style="height:34px">
            <td *ngFor="let col of columns">
                <div class="loading-text"></div>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage" let-columns>
        <tr>
            <td [attr.colspan]="columns.length">
                No records found
            </td>
        </tr>
    </ng-template>
    <!-- <ng-template pTemplate="summary">
            <ul>
                <li *ngFor="let location of selectedLocations" style="text-align: left">
                    {{location.code + ' - ' + location.name }}
                </li>
            </ul>
    </ng-template> -->
</p-table>
