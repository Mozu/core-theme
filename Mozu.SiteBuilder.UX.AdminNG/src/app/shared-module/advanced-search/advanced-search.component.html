<div class="searchBar" [ngClass]="isEditMode? 'col-md-8 col-sm-8' : 'col-md-10 col-sm-10' " id="searchBar">
    <div class="input-group">
        <div class="input-group-btn">
            <button class="btn btn-default search-btn" type="button">
                <i [ngClass]="model.status ? 'pi-times' : 'pi-search'" class="pi"
                    (click)="model.status ? resetSerach(searchBar): ''"></i>
            </button>
        </div>
        <input type="text" [(ngModel)]="model.searchField" class="form-control" #searchBar placeholder="{{'SHARED.FILTER.searchPlaceholder' | translate}}" (keyup)="toggleIcon($event)" (keyup.enter)="search(searchBar.value)" id="quote-search-input" name="quote-search-input">
    </div>
</div>

<div class="col-md-1 col-md-1">
    <span class="advance-filter" data-toggle="modal" data-target=".advanced-filter" type="button" data-backdrop="true" (click)="setAdvancedFilterValue(searchBar.value)"></span>
    <div class="modal advanced-filter" tabindex="-1" role="dialog" aria-labelledby="modal" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form name="form">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                                aria-hidden="true">&times;</span></button>
                        <h4 class="modal-title" id="gridSystemModalLabel">{{'SHARED.FILTER.advancedFilter' | translate}}</h4>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="form-group">
                                <label for="keyword">{{'SHARED.FILTER.keywordSearch' | translate}}</label>
                                <input type="text" class="form-control" id="keyword" name="keyword" [(ngModel)]='quoteFilter.keyword' (ngModelChange)="modelChanged()">
                            </div>
                            <div class="form-group">
                                <label for="quoteName">{{'SHARED.FILTER.QuotesFields.quoteName' | translate}}</label>
                                <input type="text" class="form-control" id="quoteName" name="quoteName" [(ngModel)]='quoteFilter.name' (ngModelChange)="modelChanged()">
                            </div>
                            <div class="form-group">
                                <label for="quoteId">{{'SHARED.FILTER.QuotesFields.quoteId' | translate}}</label>
                                <input type="number" min="0" class="form-control" id="quoteId" name="quoteId" [(ngModel)]='quoteFilter.quoteId' (ngModelChange)="modelChanged()">
                            </div>
                            <div class="form-group">
                                <label for="accountName">{{'SHARED.FILTER.QuotesFields.accountName' | translate}}</label>
                                <input type="text" class="form-control" id="accountName" name="accountName" [(ngModel)]='quoteFilter.accountName' (ngModelChange)="modelChanged()">
                            </div>
                            <div class="form-group">
                                <label for="accountUserName">{{'SHARED.FILTER.QuotesFields.accountUserName' | translate}}</label>
                                <input type="text" class="form-control" id="accountUserName" name="accountUserName" [(ngModel)]='quoteFilter.accountUserLastName' (ngModelChange)="modelChanged()">
                            </div>
                            <div class="form-group">
                                <label for="quoteId">{{'SHARED.FILTER.QuotesFields.expirationDate' | translate}}</label>
                                <div class="section-data datepicker">
                                    <div class="input-group" id="expirationDateFrom">
                                        <input class="form-control datepicker-control" [(ngModel)]='quoteFilter.expirationDateFrom' name="expirationDateFrom" (ngModelChange)="modelChanged()" ngbDatepicker #expirationDateFrom="ngbDatepicker" [footerTemplate]="expirationDateFromFooter" container="body">
                                        <span class="input-group-append">
                                            <i class="fa fa-calendar" (click)="expirationDateFrom.toggle()"></i>
                                        </span>
                                    </div>
                                    <div class="input-group">
                                        <span class="separator-padding">{{'SHARED.FILTER.to' | translate}}</span>
                                    </div>
                                    <div class="input-group" id="expirationDateTo">
                                        <input class="form-control datepicker-control" [(ngModel)]='quoteFilter.expirationDateTo' name="expirationDateTo" (ngModelChange)="modelChanged()" ngbDatepicker #expirationDateTo="ngbDatepicker" [footerTemplate]="expirationDateToFooter" container="body">
                                        <span class="input-group-append">
                                            <i class="fa fa-calendar" (click)="expirationDateTo.toggle()"></i>
                                        </span>
                                </div>
                                <div class="error" *ngIf="model.isExpirationToValid">The to-date can not be before from-date</div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <span type="button" class="btn cancelbtn" data-dismiss="modal">{{'SHARED.FILTER.cancelBtn' | translate}}</span>
                        <button type="button" id="btnFilter" class="sbbtn btn btn-success" [disabled]="model.isExpirationToValid" (click)="search(searchBar.value)">{{'SHARED.FILTER.filterBtn' | translate}}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<ng-template #expirationFromFooter>
    <div class="datepicker-footer">
        <a (click)="quoteFilter.expirationFrom = model.today; expirationFrom.close()" title="{{today }}">{{'SHARED.FILTER.today' | translate}}</a>
    </div>
</ng-template>
<ng-template #expirationToFooter>
    <div class="datepicker-footer">
        <a (click)="quoteFilter.expirationTo = model.today; expirationTo.close()" title="{{today}}">{{'SHARED.FILTER.today' | translate}}</a>
    </div>
</ng-template>
