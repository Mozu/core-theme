<div class="col-md-12 quote-container">
    <spinner></spinner>
    <p-table [columns]="selectedGridColumnHeader" [value]="model.items" [paginator]="true" 
    [rows]="model.numberOfRows" (onRowSelect)="onRowSelect($event)" selectionMode="single" 
    [reorderableColumns]="true">
        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns" [ngStyle]="{'display': col.display}" pReorderableColumn>
                    {{(col.header) | translate}}
                </th>
                <th class="header-ellipsis">
                    <div><i class="pi pi-ellipsis-v" (click)="gridColumnToggle.toggle($event)"></i></div>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-quoteModel let-columns="columns">
            <tr [pSelectableRow]="quoteModel">
                <td *ngFor="let col of columns" [ngStyle]="{'display': col.display}">
                   <span [ngClass]="col.class">
                       {{ getQuoteGridData(quoteModel, col) }}
                    </span>
                </td>
                <td class="header-ellipsis">
                    <div>
                        <i class="pi pi-ellipsis-v" (click)="quoteGridContextMenu.toggle($event)"></i>
                        <p-menu #quoteGridContextMenu [model]="model.quoteGridContextMenuItem" [popup]="true"
                            appendTo="body"></p-menu>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-overlayPanel #gridColumnToggle [appendTo]="'body'" [dismissable]="true">
        <div *ngFor="let col of GridColumnsOnOverlayPanel">
            <div class="col-sm-12 grid-column-container">
                <div class="input-group input-group-sm">
                    <label class="checkbox-inline" >
                        <input type="checkbox" class="custom-control-input" value="{{col.name}}" [checked]="col.checked"
                        (change)="toggleGridColumns($event)" >
                        {{(col.name)  | translate}}
                        <span class="cr"><i class="cr-icon fa fa-check"></i></span>
                    </label>
                </div>
            </div>
        </div>
    </p-overlayPanel>
</div>
