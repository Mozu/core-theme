<p-table [value]="historyLog" [responsive]="true" [paginator]="true" [rows]="5">
  <ng-template pTemplate="header">
      <tr>
          <th>Date</th>
          <th>Event</th>
          <th>User</th>
      </tr>
  </ng-template>
  <ng-template pTemplate="body" let-quoteModel>
      <tr>
          <td><span>{{quoteModel.Date}}</span></td>
          <td><span>{{quoteModel.Event}}</span></td>
          <td><span>{{quoteModel.User}}</span></td>
      </tr>
  </ng-template>
</p-table>
